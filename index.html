<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SCUMM — Retro Multi-Console Space</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>

<body>

  <div class="desktop" id="desktop">
    <div class="icon-grid" id="icon-grid"></div>

    <div class="watermark">
      <img class="watermark-logo" src="assets/logo-white.svg" alt="Scumm skull logo">
      <div class="watermark-text">
        <div class="watermark-sub">A Retro Gaming Space</div>
        <div class="watermark-title"><b>SCUMM</b></div>
      </div>
    </div>

    <div class="credit">
      Engine: <a href="https://emulatorjs.org" target="_blank" rel="noopener">EmulatorJS</a> (RetroArch/libretro
      via
      WebAssembly, cores served from their public CDN).
    </div>
  </div>

  <div class="taskbar">
    <div class="start-wrap">
      <button class="start-btn" id="start-btn">
        <img class="start-logo" src="assets/logo-black.svg" alt="">Start</button>
      <div class="start-menu" id="start-menu">
        <div class="start-menu-banner"><img class="banner-logo" src="assets/logo-white.svg" alt=""><span>SCUMM</span>
        </div>
        <div class="start-menu-items">

          <div class="start-menu-item" id="profile-item">
            <span class="item-icon">🙂</span> Profile
          </div>
          <div class="start-menu-item" id="settings-item">
            <span class="item-icon">⚙️</span> Settings <span class="arrow">▶</span>
            <div class="start-submenu settings-submenu">
              <div class="submenu-row" id="controls-item">Controls</div>
            </div>
          </div>
          <div class="start-menu-item" id="more-consoles-item">
            <span class="item-icon">🕹️</span> Soon more consoles <span class="arrow">▶</span>
            <div class="start-submenu" id="start-submenu"></div>
          </div>
          <div class="start-menu-divider"></div>
          <div class="start-menu-item" id="refresh-item">
            <span class="item-icon">🔃</span> Refresh Desktop
          </div>
        </div>
      </div>
    </div>
    <div class="taskbar-spacer"></div>
    <div class="taskbar-sep"></div>
    <div class="taskbar-clock" id="taskbar-clock">—</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="window" id="window">
      <div class="window-titlebar">
        <div class="title-left">
          <span class="title-icon">🕹️</span>
          <span class="window-title" id="window-title">—</span>
        </div>
        <div class="title-controls">
          <button class="win-btn" id="min-btn" title="Minimize">_</button>
          <button class="win-btn" id="max-btn" title="Maximize">▢</button>
          <button class="win-btn" id="close-dot" title="Close">×</button>
        </div>
      </div>
      <div class="window-body" id="window-body"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
